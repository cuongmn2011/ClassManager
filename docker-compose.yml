# docker-compose.yml - Phiên bản cuối cùng đã sửa lỗi HTTPS

services:
  # Dịch vụ Web cho API của chúng ta
  api:
    container_name: classmanager-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    # Ra lệnh cho Docker Compose đọc các biến từ file .env
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      # Gắn thư mục .certs từ máy bạn vào thư mục /https trong container
      - ./.certs:/https/
      - ./fileupload:/app/wwwroot/uploads
    environment:
      # Sử dụng biến đã được định nghĩa trong file .env
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      # Cấu hình các URL
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      # === PHẦN BỊ THIẾU LÀ Ở ĐÂY ===
      # Chỉ cho Kestrel biết mật khẩu của file chứng chỉ
      - Kestrel__Certificates__Default__Password=${KestrelCertPassword}
      # Chỉ cho Kestrel biết đường dẫn tới file chứng chỉ BÊN TRONG container
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    