# render.yaml - NEW APPROACH: Manual Connection String

databases:
  - name: classmanager-db
    plan: starter
    databaseName: classmanagerdb
    user: classmanager_user

services:
  - type: web
    name: classmanager-api
    runtime: docker
    dockerfilePath: ./src/Api/Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      
      # --- PHẦN THAY ĐỔI LÀ Ở ĐÂY ---
      # Thay vì dùng 'fromService', chúng ta tự tạo chuỗi kết nối
      # từ các biến môi trường mà Render cung cấp cho service 'classmanager-db'.
      # Cú pháp ${serviceName.property} sẽ tự động được thay thế khi chạy.
      - key: ConnectionStrings__DefaultConnection
        value: "Host=${classmanager-db.host};Port=5432;Database=${classmanager-db.database};Username=${classmanager-db.user};Password=${classmanager-db.password}"
      # --- KẾT THÚC PHẦN THAY ĐỔI ---

      - key: APPLY_MIGRATIONS
        value: "true"