# render.yaml - FINAL CORRECTED VERSION

# Databases have their own top-level key.
databases:
  - name: classmanager-db
    plan: starter
    databaseName: classmanagerdb
    user: classmanager_user

# Services have their own separate top-level key.
services:
  - type: web
    name: classmanager-api
    runtime: docker
    dockerfilePath: ./src/Api/Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      # This is the corrected block for the connection string
      - key: ConnectionStrings__DefaultConnection
        fromService:
          type: psql  # This 'type' key IS required, my apologies for the previous instruction.
          name: classmanager-db # This name must match the database name above.
          property: connectionString
      - key: APPLY_MIGRATIONS
        value: "true"